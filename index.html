<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨ AI ChatBot – Gemini Demo</title>
  <meta name="description" content="A premium static chatbot powered by Google Gemini, hosted on GitHub Pages." />
  <!-- Open Graph for rich sharing -->
  <meta property="og:title" content="AI ChatBot – Gemini Demo" />
  <meta property="og:description" content="Interact with a sleek AI chat interface that uses the Gemini model, all from a static GitHub Pages site." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://YOUR_USERNAME.github.io/YOUR_REPO/" />
  <meta property="og:image" content="https://YOUR_USERNAME.github.io/YOUR_REPO/assets/mockup.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🤖 Gemini ChatBot</h1>
      <p class="subtitle">Ask anything – the AI will answer with natural language.</p>
    </header>
    <section id="chat" class="chat-window"></section>
    <div class="input-area">
      <input type="text" id="user-input" placeholder="Type your question…" autocomplete="off" />
      <button id="send-btn" aria-label="Send message">✈️</button>
    </div>
    <footer>
      <small>🔑 Replace <code>YOUR_GEMINI_API_KEY_HERE</code> in <code>script.js</code> with your Gemini API key.</small>
    </footer>
  </div>
  <script src="assets/script.js"></script>
</body>
</html>
